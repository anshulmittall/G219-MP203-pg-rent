# MP203 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.
#
# Data part: output of  PYTHONPATH=src python -m pgrent.data_checks
# Tracking:  output of  PYTHONPATH=src python -m pgrent.train
# Monitoring: reports/monitoring.json, written by  python -m pgrent.monitor

group_id: "G219"          # your group id, e.g. "G042"
problem_id: "MP203"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: "rent_in_signed_agreement"           # the column that must not be used as a feature
  unit_mixup:
    present: false
    column: null           # the column recorded in a different unit
    group_value: null      # the value of locality whose rows are affected
    factor: null           # wrong value = right value x factor
  sentinel_value:
    present: false
    column: null
    value: null            # the special number typed instead of a blank
    count: null            # how many rows have it
  duplicate_rows:
    present: false
    count: null            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: "distance_to_campus_km"
    start_date: "2026-05-06"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-05-25"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 14              # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: "furnishing"
    true_levels: 3         # how many real categories there are after cleaning

tracking:
  experiment_name: "mp203-pg-rent"
  best_run_id: "9217851c0f104fffa9ac868c15e4ce7f"        # the MLflow run id of your v1 model
  registered_model_name: "mp203-rent-model"
  champion_version: 2

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    distance_to_campus_km: null
    room_area_sqft: null
    sharing: null
    meals_per_day: null
    building_age_yr: null
    wifi_mbps: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of locality
    'Sector East': null
    'Sector West': null
    'Market Side': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null         # promote or keep
